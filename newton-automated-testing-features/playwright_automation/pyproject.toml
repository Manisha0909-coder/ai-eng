[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-playwright-tests"
version = "0.1.0"
description = "Playwright smoke tests for GoTalk.dev"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50",
  "pytest>=8.0",
  "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "smoke: quick readiness checks",
]
