name: employee-rag build & publish

on:
  push:
    branches: [main]
    paths:
      - "employee-rag/**"
      - ".github/workflows/employee-rag-deploy.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: employee-rag
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/employee-rag:latest
            ghcr.io/${{ env.OWNER_LC }}/employee-rag:${{ github.sha }}

      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 -e OPENROUTER_API_KEY=dummy \
            ghcr.io/${{ env.OWNER_LC }}/employee-rag:latest

          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              ok=1
              break
            fi
            sleep 5
          done

          docker logs smoke
          docker stop smoke

          if [ -z "$ok" ]; then
            echo "Container never became healthy"
            exit 1
          fi
          echo "Smoke test passed"
