name: employee-rag nightly eval

# Live-LLM eval, kept separate from ci.yml (which never spends real
# OpenRouter budget): runs weekly, or on demand, so the test-split
# accuracy and red-team pass rate get tracked over time without costing
# anything on every push/PR.
on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 03:00 UTC -- comfortably inside the free-tier daily
    # cap (40 test-split calls + 25 red-team calls = 65, so this alone
    # needs 2 of its own days' budget if run back-to-back; see --resume
    # below for why that's fine).
    - cron: "0 3 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-rag
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: employee-rag/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --fail-under is intentionally not set: there's no real test-split
      # number to gate on yet (the live multi-turn/red-team baselines were
      # still pending as of this workflow's introduction -- see the
      # gap-closing Stage 4/5 notes). Once a real run's overall_accuracy
      # is known, ask before picking a --fail-under threshold here; a
      # placeholder number would either never trip or trip on noise.
      - name: Run eval (test split, resumable, capped)
        run: python -m eval.run_eval --split test --max-calls 40 --resume

      - name: Run red-team suite
        run: python -m eval.run_redteam --max-calls 40

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_id }}
          path: |
            employee-rag/eval/report.json
            employee-rag/eval/reports/
            employee-rag/eval/redteam_report.json
          if-no-files-found: warn
