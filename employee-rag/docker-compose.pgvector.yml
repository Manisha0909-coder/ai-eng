# Local-only pgvector backend for rag/pgvector_store.py (VECTOR_BACKEND=pgvector).
# Free, no cloud -- a drop-in alternative to the default Chroma backend for
# demonstrating a production-scale vector store. Not used by the deployed
# demo (Cloud Run), which stays on Chroma.
#
# Usage:
#   docker compose -f docker-compose.pgvector.yml up -d
#   VECTOR_BACKEND=pgvector python -m rag.ingest
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_rag
    ports:
      - "5433:5432" # non-default host port to avoid clashing with a local Postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
